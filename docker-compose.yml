services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsu_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-tsu_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Задайте TELEGRAM_BOT_TOKEN в .env}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:?Задайте TELEGRAM_OWNER_ID в .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tsu_bot}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-tsu_bot}
      CONFIG_PATH: /app/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro   # нужен только для schedule.source: ics
    logging: *logging

volumes:
  pgdata:
